name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build auth_service
        uses: docker/build-push-action@v5
        with:
          context: ./services/auth_service
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build content_service
        uses: docker/build-push-action@v5
        with:
          context: ./services/content_service
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build community_service
        uses: docker/build-push-action@v5
        with:
          context: ./services/community_service
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build transaction_service
        uses: docker/build-push-action@v5
        with:
          context: ./services/transaction_service
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build notification_service
        uses: docker/build-push-action@v5
        with:
          context: ./services/notification_service
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build chat_service
        uses: docker/build-push-action@v5
        with:
          context: ./services/chat_service
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build search_service
        uses: docker/build-push-action@v5
        with:
          context: ./services/search_service
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key $SSH_USER@$SSH_HOST << 'ENDSSH'
            if [ -d /opt/idea-code/.git ]; then
              cd /opt/idea-code && git pull origin main
            else
              git clone ${{ github.server_url }}/${{ github.repository }}.git /opt/idea-code
              cd /opt/idea-code
            fi
            docker compose -f services/docker-compose.yml up -d --build
            docker compose -f services/docker-compose.yml up -d --force-recreate nginx

            # Wait for services to be healthy (poll instead of sleep)
            echo "Waiting for services to be ready..."
            for i in $(seq 1 30); do
              if curl -sf http://localhost:8000/health > /dev/null 2>&1; then
                echo "Gateway is healthy!"
                break
              fi
              echo "Attempt $i/30: waiting..."
              sleep 2
            done

            # Seed databases (skips existing records, safe to run on every deploy)
            # Auth service seeds
            docker cp services/auth_service/seed.py services-auth_service-1:/app/seed.py
            docker exec services-auth_service-1 python seed.py
            docker cp services/auth_service/seed_mentors.py services-auth_service-1:/app/seed_mentors.py
            docker exec services-auth_service-1 python seed_mentors.py

            # Content service seeds
            docker cp services/content_service/seed.py services-content_service-1:/app/seed.py
            docker exec services-content_service-1 python seed.py
            docker cp services/content_service/seed_extra.py services-content_service-1:/app/seed_extra.py
            docker exec services-content_service-1 python seed_extra.py

            # Community service seeds
            docker cp services/community_service/seed.py services-community_service-1:/app/seed.py
            docker exec services-community_service-1 python seed.py
            docker cp services/community_service/seed_projects.py services-community_service-1:/app/seed_projects.py
            docker exec services-community_service-1 python seed_projects.py

            # Chat service seed
            docker cp services/chat_service/seed.py services-chat_service-1:/app/seed.py
            docker exec services-chat_service-1 python seed.py
          ENDSSH
